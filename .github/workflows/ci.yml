name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Same image as docker-compose.yml. No Gemini API key in CI: tests never call the network.
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: drone
          POSTGRES_PASSWORD: drone
          POSTGRES_DB: drone_regs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drone -d drone_regs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The tests create this database on the service if it does not exist.
      TEST_DATABASE_URL: postgresql://drone:drone@localhost:5432/drone_regs_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest

      # The page logic in frontend/render.js; Node's built-in test runner, no packages.
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Test frontend
        run: node --test frontend/tests/
