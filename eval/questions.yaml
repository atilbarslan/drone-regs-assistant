- id: en-01
  lang: en
  jurisdiction:
  - EU
  question: What is the maximum height I can fly in the open category?
  expected_sources:
  - source_id: easa-ear-uas
    section_ref: Article 4 (2019/947)
  - source_id: easa-ear-uas
    section_ref: UAS.OPEN.010
  should_refuse: false
  must:
  - 120 m from the closest point of the earth's surface
  - 'exception only within 50 m horizontally of an artificial obstacle taller than 105 m: up to 15 m above
    the obstacle, at the request of the entity responsible for it'
  should:
  - over natural elevations the distance is measured from the closest point of the surface
  - unmanned sailplanes under 10 kg exception
- id: en-02
  lang: en
  jurisdiction:
  - EU
  - none
  question: My drone weighs 200 g and has a camera. Do I need to register as an operator?
  expected_sources:
  - source_id: easa-ear-uas
    section_ref: Article 14 (2019/947)
  - source_id: shgm-sht-iha
    section_ref: Madde 11
  should_refuse: false
  must:
  - 'yes: registration is required if the drone has a sensor able to capture personal data, unless it
    is a toy (Directive 2009/48/EC)'
  should:
  - registration is also required at 250 g or more or above 80 J
  - 'if answered for both: in Turkey every user must register except for a ''Basit İHA'' (Madde 11(1))'
- id: en-03
  lang: en
  jurisdiction:
  - EU
  question: How far from uninvolved people must I stay with a C2 drone in subcategory A2?
  expected_sources:
  - source_id: easa-ear-uas
    section_ref: UAS.OPEN.030
  - source_id: easa-ear-uas
    section_ref: AMC1 UAS.OPEN.030(1)
  - source_id: easa-ear-uas
    section_ref: Part 3 (2019/945 Annex)
  should_refuse: false
  must:
  - at least 30 m horizontally
  - down to 5 m with an active low-speed mode after assessing weather, UA performance and segregation
    of the area
  should:
  - AMC recommends the 1:1 rule (guidance, not binding)
  - C2 low-speed mode limits ground speed to max 3 m/s
- id: en-04
  lang: en
  jurisdiction:
  - EU
  question: In subcategory A3, how far from residential areas do I need to fly?
  expected_sources:
  - source_id: easa-ear-uas
    section_ref: UAS.OPEN.040
  should_refuse: false
  must:
  - at least 150 m horizontally from residential, commercial, industrial or recreational areas
  should: []
