  should: []
- id: en-07
  lang: en
  jurisdiction:
  - EU
  question: What are the main requirements for a class C0 drone?
  expected_sources:
  - source_id: easa-ear-uas
    section_ref: Part 1 (2019/945 Annex)
  should_refuse: false
  must:
  - MTOM less than 250 g including payload
  - maximum level-flight speed 19 m/s
  - maximum height above take-off point limited to 120 m
  should:
  - exclusively electric
  - follow-me mode within 50 m
- id: en-08
  lang: en
  jurisdiction:
  - EU
  question: Can I fly at night in the open category, and is there any extra requirement?
  expected_sources:
  - source_id: easa-ear-uas
    section_ref: UAS.OPEN.060
  should_refuse: false
  must:
  - yes; a green flashing light on the drone must be activated
  should: []
- id: en-09
  lang: en
  jurisdiction:
  - EU
  question: When do I need an operational authorisation instead of flying in the open category?
  expected_sources:
  - source_id: easa-ear-uas
    section_ref: Article 5 (2019/947)
  - source_id: easa-ear-uas
    section_ref: Article 12 (2019/947)
  - source_id: easa-ear-uas
    section_ref: UAS.SPEC.020
  should_refuse: false
  must:
  - when any Article 4 / Part A requirement is not met (specific category)
  - authorisation from the competent authority of the state of registration, with a risk assessment
  should:
  - 'alternative: declaration for a standard scenario'
  - not needed with an LUC or a model club authorisation
- id: en-10
  lang: en
  jurisdiction:
  - EU
  - none
  question: What risk assessment do I have to submit with an application for an operational authorisation?
  expected_sources:
  - source_id: easa-ear-uas
    section_ref: Article 5 (2019/947)
  - source_id: easa-ear-uas
    section_ref: Article 11 (2019/947)
  - source_id: shgm-sht-iha
    section_ref: Madde 9
  should_refuse: false
  must:
  - a risk assessment according to Article 11, with adequate mitigating measures
  should:
  - the AMC method is SORA
  - 'if answered for both: Turkey has no separate per-flight risk assessment method; risk is embedded
    in the pilot licence level (Madde 9(1))'
