# Validated evaluation set for drone-regs-assistant (7 October 2026).
# Answer keys written from the source texts by the team lead. All 36 answer keys checked
# against the official PDFs by Atıl Arslan (UAS pilot), 7 October 2026.
# Do not edit the keys without a source check.
# must:   facts the answer has to contain (missing one = incomplete)
# should: facts that improve the answer (missing one is not an error)
# jurisdiction: acceptable results of app.jurisdiction.detect (any of the listed values passes).
#   Two values = the question is genuinely ambiguous; a two-sided answer is also acceptable.
questions:
- id: tr-01
  lang: tr
  jurisdiction:
  - TR
  question: P1 lisansıyla ticari çekim yapacağım. En fazla ne kadar yükseğe ve ne kadar uzağa uçabilirim?
  expected_sources:
  - source_id: shgm-sht-iha
    section_ref: Madde 15
  - source_id: shgm-sht-iha
    section_ref: Madde 11
  should_refuse: false
  must:
  - azami 120 m yükseklik
  - azami 3.000 m yatay uzaklık
  - her durumda görsel görüş hattında (VLOS) kalmak
  should:
  - bunun ötesi P2 lisansı ve tescil gerektirir
- id: tr-02
  lang: tr
  jurisdiction:
  - TR
  question: 4,5 kg'lık bir drone yeni talimata göre hangi sınıfa girer?
  expected_sources:
  - source_id: shgm-sht-iha
    section_ref: Madde 8
  should_refuse: false
  must:
  - M1 sınıfı (4 kg dâhil – 25 kg)
  should: []
- id: tr-03
  lang: tr
  jurisdiction:
  - TR
  - none
  question: Oyuncak drone için lisans ya da kayıt gerekiyor mu?
  expected_sources:
  - source_id: shgm-sht-iha
    section_ref: Madde 8
  - source_id: shgm-sht-iha
    section_ref: Madde 4
  - source_id: shgm-sht-iha
    section_ref: Madde 11
  - source_id: shgm-sht-iha
    section_ref: Madde 15
  - source_id: shgm-sht-iha
    section_ref: Madde 12
  should_refuse: false
  must:
  - cevap tanıma bağlıdır; 'oyuncak' kelimesi yetmez
  - Basit İHA ise (tasarımı gereği 10 m yarıçap ve 20 m yükseklik dışına çıkamıyor, M0 özelliklerini aşmıyor)
    lisans, kayıt, tescil ve ithal uygunluk gerekmez
  - bu zarfın dışına çıkabiliyorsa 500 g altında olsa bile M0 hükümleri uygulanır; lisans ve kayıt gerekir
    (Madde 8(3))
  should:
  - Basit İHA kırmızı bölgeye giremez
- id: tr-04
  lang: tr
  jurisdiction:
  - TR
  question: Eski talimata göre aldığım İHA1 sertifikası ne olacak?
  expected_sources:
  - source_id: shgm-sht-iha
    section_ref: Madde 29
  should_refuse: false
  must:
  - P1 lisansına dönüştürülür
  - intibak eğitimi 31/07/2027'ye kadar tamamlanırsa geçerliliğini korur
  should:
  - kazanılmış haklar ve uçuş tecrübesi korunur
- id: tr-05
  lang: tr
  jurisdiction:
  - TR
  question: Yeni talimat yayımlandı ama eski kurallar hâlâ uygulanabiliyor mu? Geçiş ne zamana kadar?
  expected_sources:
  - source_id: shgm-sht-iha
    section_ref: Geçici Madde 1
  should_refuse: false
  must:
  - tam uyum için 31/07/2027'ye kadar geçiş süresi
  - bu sürede emniyeti tehlikeye atmayan hâllerde eski hükümlerin uygulanmasına SHGM izin verebilir
  should:
  - İHATTYS devreye alınana kadar kayıt/izin işlemlerinde eski mevzuat hükümleri de uygulanır
- id: tr-06
  lang: tr
  jurisdiction:
  - TR
  - none
  question: Elimdeki dronu yeni kurallara uygun hâle getirmek için ne yapmam gerekiyor, son tarih ne?
  expected_sources:
  - source_id: shgm-sht-iha
    section_ref: Madde 27
  - source_id: shgm-sht-iha
    section_ref: Geçici Madde 2
  - source_id: shgm-sht-iha
    section_ref: Madde 25
  should_refuse: false
  must:
  - kayıt, uzaktan tanımlama, geofence, uyum yazılım modülü, yazılım sertifikasyonu ve İHATTYS entegrasyonu
  - son tarih 31/07/2027
  - süre sonunda dönüştürülmemiş araç uçurulamaz
  should:
  - üretici/ithalatçı/dağıtıcı ile iletişime geçilir
- id: tr-07
  lang: tr
  jurisdiction:
  - TR
  question: P1 lisansım var. Kırmızı bölgede uçabilir miyim?
  expected_sources:
  - source_id: shgm-sht-iha
    section_ref: Madde 12
  should_refuse: false
  must:
  - bölgeyi kapatan kurumun uygunluğu (gerekirse Cumhurbaşkanlığı) ile
  - SHGM izni ve NOTAM ile
  - kurum uygunluk vermezse izin verilmez
  should: []
