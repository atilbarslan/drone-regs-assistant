- id: tr-10
  lang: tr
  jurisdiction:
  - TR
  question: Yurt dışından yanımda getirdiğim bir dronu Türkiye'de uçurabilir miyim?
  expected_sources:
  - source_id: shgm-sht-iha
    section_ref: Madde 24
  - source_id: shgm-sht-iha
    section_ref: Madde 11
  - source_id: shgm-sht-iha
    section_ref: Madde 15
  - source_id: shgm-sht-iha
    section_ref: Madde 12
  should_refuse: false
  must:
